<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Jack's Void — Jeopardy</title>
  <link rel="icon" type="image/x-icon" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Your site CSS (optional, but recommended for typography/buttons) -->
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/navbar.css" />

  <style>
    :root{
      --j-blue: #060CE9;      /* classic Jeopardy-ish blue */
      --j-blue-2: #0407b8;
      --j-gold: #FFCC00;      /* gold text */
      --j-border: rgba(255,255,255,0.20);
      --j-used: rgba(255,255,255,0.10);
      --j-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    body{
      padding-bottom: 2rem; /* no fixed footer on this page */
    }

    /* Floating buttons (reuse your existing .floating-btn + icon styles if common.css is present) */
    .floating-btn{
      position: fixed;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      font-size: 1.3rem;
      z-index: 9999;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
    }
    #musicToggle { top: 1rem; right: 1rem; }
    #homeButton  { top: 1rem; left: 1rem; }

    .floating-btn img.icon{
      width: 70%;
      height: 70%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.25));
    }

    /* Header block (optional; you can swap this for your header component later) */
    header.jeopardy-header{
      text-align:center;
      padding: 2.25rem 1rem 1.25rem;
    }
    header.jeopardy-header h1{
      margin: 0;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    header.jeopardy-header p{
      margin: 0.4rem 0 0;
      opacity: 0.8;
    }

    /* Scoreboard */
    .scoreboard{
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin: 1rem auto 1.5rem;
      max-width: 1000px;
      padding: 0 1rem;
    }
    .player-card{
      border: 1px solid var(--j-border);
      border-radius: 16px;
      padding: 0.9rem 1rem;
      background: rgba(0,0,0,0.30);
      box-shadow: var(--j-shadow);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 0.75rem;
    }
    .player-left{
      display:flex;
      align-items:center;
      gap: 0.65rem;
      min-width: 0;
    }
    .player-emoji{
      font-size: 1.75rem;
      width: 2.25rem;
      text-align:center;
      flex: 0 0 auto;
    }
    .player-name{
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-score{
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--j-gold);
    }

    /* Board */
    .board-wrap{
      max-width: 1100px;
      margin: 0 auto 2rem;
      padding: 0 1rem;
    }
    .board{
      display:grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .category{
      background: linear-gradient(180deg, var(--j-blue), var(--j-blue-2));
      border: 1px solid var(--j-border);
      border-radius: 10px;
      padding: 0.85rem 0.6rem;
      text-align:center;
      color: white;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.6px;
      box-shadow: var(--j-shadow);
      min-height: 64px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .clue{
      background: linear-gradient(180deg, var(--j-blue), var(--j-blue-2));
      border: 1px solid var(--j-border);
      border-radius: 10px;
      padding: 1.05rem 0.6rem;
      text-align:center;
      color: var(--j-gold);
      font-weight: 900;
      font-size: 1.35rem;
      cursor: pointer;
      user-select: none;
      box-shadow: var(--j-shadow);
      transition: transform 0.12s ease, filter 0.2s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 74px;
    }
    .clue:hover{
      transform: translateY(-2px);
      filter: brightness(1.06);
    }
    .clue.used{
      background: rgba(255,255,255,0.06);
      color: rgba(255, 204, 0, 0.35);
      border-color: rgba(255,255,255,0.12);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Modal: Jeopardy vibe */
    .modal-content{
      background: rgba(0,0,0,0.92);
      border: 1px solid rgba(255,255,255,0.18);
      color: white;
      border-radius: 18px;
      box-shadow: var(--j-shadow);
    }
    .modal-header{
      border-bottom: 1px solid rgba(255,255,255,0.14);
    }
    .modal-footer{
      border-top: 1px solid rgba(255,255,255,0.14);
    }
    .answer-box{
      border: 1px dashed rgba(255,255,255,0.25);
      border-radius: 14px;
      padding: 0.9rem 1rem;
      background: rgba(255,255,255,0.05);
    }
    .answer-hidden{
      filter: blur(10px);
      user-select: none;
    }
    .hint{
      opacity: 0.75;
      font-size: 0.9rem;
    }

    @media (max-width: 992px){
      .board{ gap: 8px; }
      .clue{ font-size: 1.1rem; min-height: 64px; }
      .category{ font-size: 0.8rem; }
      .scoreboard{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <!-- Music element for your toggle -->
  <audio id="bgm" loop preload="auto">
    <source src="assets/sfx/jeopardy.mp3" type="audio/mpeg" />
  </audio>

  <!-- Floating buttons -->
  <button id="homeButton" class="floating-btn" title="Return to the Void">
    <img class="icon" src="../assets/img/buttons/spiritomb.png" alt="Return to the Void" />
  </button>
  <button id="musicToggle" class="floating-btn" title="Toggle Music">
    <img id="musicIcon" class="icon" src="../assets/img/buttons/meloetta-aria.png" alt="Toggle Music" />
  </button>

  <header class="jeopardy-header">
    <h1>VOID JEOPARDY</h1>

  <!-- Scoreboard -->
  <section class="scoreboard" id="scoreboard"></section>

  <!-- Board -->
  <main class="board-wrap">
    <div class="board" id="board"></div>
  </main>

  <!-- Setup Modal -->
  <div class="modal fade" id="setupModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Enter Contestants</h5>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Contestant 1</label>
              <div class="d-flex gap-2">
                <input id="p1Name" class="form-control" placeholder="Name" />
                <select id="p1Emoji" class="form-select" style="max-width: 140px"></select>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label">Contestant 2</label>
              <div class="d-flex gap-2">
                <input id="p2Name" class="form-control" placeholder="Name" />
                <select id="p2Emoji" class="form-select" style="max-width: 140px"></select>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label">Contestant 3</label>
              <div class="d-flex gap-2">
                <input id="p3Name" class="form-control" placeholder="Name" />
                <select id="p3Emoji" class="form-select" style="max-width: 140px"></select>
              </div>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button id="startGameBtn" class="btn btn-warning fw-bold">Start Game</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Clue Modal -->
  <div class="modal fade" id="clueModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <div class="hint" id="clueMeta"></div>
            <h5 class="modal-title" id="clueTitle">Clue</h5>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3 fs-5" id="clueQuestion"></div>

          <div class="answer-box">
            <div class="d-flex align-items-center justify-content-between gap-3 mb-2">
              <div class="fw-bold">Answer</div>
              <button id="revealBtn" class="btn btn-outline-light btn-sm">Reveal</button>
            </div>
            <div id="clueAnswer" class="answer-hidden">Hidden</div>
          </div>

          <hr class="my-4" />

          <div class="row g-3 align-items-end">
            <div class="col-12 col-md-6">
              <label class="form-label">Who's answering?</label>
              <select id="playerSelect" class="form-select"></select>
            </div>

            <div class="col-12 col-md-6 d-flex gap-2 justify-content-md-end">
              <button id="awardBtn" class="btn btn-success fw-bold w-100 w-md-auto">Award</button>
              <button id="penaltyBtn" class="btn btn-danger fw-bold w-100 w-md-auto">Penalty</button>
            </div>
          </div>

          <div class="hint mt-2">
            Award adds points; Penalty subtracts points.
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /**************************************************************
     * DATA SOURCE
     * For now, we use embedded JSON. Later you can:
     * - fetch("assets/data/jeopardy.json")
     * - or hook to an API and transform into this shape.
     **************************************************************/
    const GAME_DATA = {
      categories: [
        {
          title: "WEB DEV",
          clues: [
            { value: 200, question: "What HTML element is used for the largest heading?", answer: "<h1>" },
            { value: 400, question: "What CSS property controls stacking order?", answer: "z-index" },
            { value: 600, question: "What does JSON stand for?", answer: "JavaScript Object Notation" },
            { value: 800, question: "What HTTP status code means 'Not Found'?", answer: "404" },
            { value: 1000, question: "Name the browser API used to store key-value data persistently.", answer: "localStorage" },
          ]
        },
        {
          title: "VOID LORE",
          clues: [
            { value: 200, question: "MIRTH stands for what?", answer: "Municipal Investment in Recreation, Theatre, and Happiness" },
            { value: 400, question: "What Pokémon is the 'Return to the Void' button?", answer: "Spiritomb" },
            { value: 600, question: "What Pokémon toggles the music?", answer: "Meloetta" },
            { value: 800, question: "Your site aesthetic is best described as…", answer: "Gold-on-black, theatrical, and mischievously reflective" },
            { value: 1000, question: "The Void runs best when pages are served by what protocol locally?", answer: "http:// (via a dev server)" },
          ]
        },
        {
          title: "COMPUTERS",
          clues: [
            { value: 200, question: "What does CPU stand for?", answer: "Central Processing Unit" },
            { value: 400, question: "What does RAM stand for?", answer: "Random Access Memory" },
            { value: 600, question: "What’s the name of the version control system you used today?", answer: "Git" },
            { value: 800, question: "SSH uses public-key cryptography for what purpose here?", answer: "Authentication to GitHub" },
            { value: 1000, question: "What command shows your git remotes?", answer: "git remote -v" },
          ]
        },
        {
          title: "TRAVEL",
          clues: [
            { value: 200, question: "Which library did you use for the map page?", answer: "Leaflet" },
            { value: 400, question: "What tile source did you use without tokens?", answer: "OpenStreetMap tiles" },
            { value: 600, question: "What’s the capital of Thailand?", answer: "Bangkok" },
            { value: 800, question: "What city is in Ontario and appears on your map?", answer: "Toronto" },
            { value: 1000, question: "What is the ‘fit everything’ map helper called in Leaflet?", answer: "fitBounds" },
          ]
        },
        {
          title: "GAMES",
          clues: [
            { value: 200, question: "Jeopardy has how many categories on the board?", answer: "6" },
            { value: 400, question: "Jeopardy clue values typically increase by what amount (classic board)?", answer: "200" },
            { value: 600, question: "In Jeopardy, contestants respond in the form of what?", answer: "A question" },
            { value: 800, question: "What does MVP stand for in product dev?", answer: "Minimum Viable Product" },
            { value: 1000, question: "Name a classic management sim that inspired your project.", answer: "SimGolf / RollerCoaster Tycoon (either)" },
          ]
        },
        {
          title: "MISC",
          clues: [
            { value: 200, question: "What is 42 famously called in Hitchhiker’s Guide?", answer: "The answer to life, the universe, and everything" },
            { value: 400, question: "What is 17 (your preferred number) mathematically?", answer: "A prime number" },
            { value: 600, question: "Queue is a Q with what standing behind it?", answer: "Random vowels" },
            { value: 800, question: "Which OS is your dev machine?", answer: "macOS" },
            { value: 1000, question: "What local command starts a quick dev server?", answer: "python3 -m http.server 8000" },
          ]
        },
      ]
    };

    /**************************************************************
     * STATE
     **************************************************************/
    const EMOJIS = ["😈","🤖","🧠","🦇","🕶️","✨","🦉","🦊","🐙","🦄","🧙","🧛","🦇","🐸","🧿","🎭","🎲","🪄","⚡","🌙"];
    let players = [
      { name: "Contestant 1", emoji: "🎭", score: 0 },
      { name: "Contestant 2", emoji: "🤖", score: 0 },
      { name: "Contestant 3", emoji: "🧠", score: 0 },
    ];

    // Track used clues by categoryIndex + clueIndex
    const used = new Set(); // key: `${c}:${q}`

    // Currently open clue
    let current = null;

    /**************************************************************
     * HELPERS
     **************************************************************/
    function $(id){ return document.getElementById(id); }

    function basePathFromThisPage(){
      // Robust enough for local + github pages if you later move it:
      // If you host at /the-void/, set repoBase = "/the-void"
      const isGitHub = window.location.hostname.includes("github.io");
      const repoBase = "the-void";
      return isGitHub ? `/${repoBase}` : "";
    }

    function fmtMoney(v){ return `$${v}`; }

    function renderScoreboard(){
      const el = $("scoreboard");
      el.innerHTML = "";
      players.forEach((p, i) => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.innerHTML = `
          <div class="player-left">
            <div class="player-emoji">${p.emoji}</div>
            <div class="player-name">${p.name}</div>
          </div>
          <div class="player-score" id="score-${i}">${p.score}</div>
        `;
        el.appendChild(card);
      });
    }

    function renderBoard(){
      const board = $("board");
      board.innerHTML = "";

      // Categories row
      GAME_DATA.categories.forEach(cat => {
        const c = document.createElement("div");
        c.className = "category";
        c.textContent = cat.title;
        board.appendChild(c);
      });

      // 5 rows of clues
      for(let row = 0; row < 5; row++){
        for(let col = 0; col < 6; col++){
          const key = `${col}:${row}`;
          const cat = GAME_DATA.categories[col];
          const clue = cat.clues[row];

          const tile = document.createElement("div");
          tile.className = "clue" + (used.has(key) ? " used" : "");
          tile.textContent = fmtMoney(clue.value);

          tile.addEventListener("click", () => {
            if (used.has(key)) return;
            openClue(col, row);
          });

          board.appendChild(tile);
        }
      }
    }

    function populateEmojiSelect(selectEl){
      selectEl.innerHTML = "";
      EMOJIS.forEach(e => {
        const opt = document.createElement("option");
        opt.value = e;
        opt.textContent = e;
        selectEl.appendChild(opt);
      });
    }

    function openClue(categoryIndex, clueIndex){
      const cat = GAME_DATA.categories[categoryIndex];
      const clue = cat.clues[clueIndex];

      current = { categoryIndex, clueIndex, catTitle: cat.title, ...clue };

      $("clueMeta").textContent = `${cat.title} • ${fmtMoney(clue.value)}`;
      $("clueTitle").textContent = "Clue";
      $("clueQuestion").textContent = clue.question;

      $("clueAnswer").textContent = clue.answer;
      $("clueAnswer").classList.add("answer-hidden");
      $("revealBtn").disabled = false;

      // Populate player dropdown
      const sel = $("playerSelect");
      sel.innerHTML = "";
      players.forEach((p, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = `${p.emoji} ${p.name}`;
        sel.appendChild(opt);
      });

      // Show modal
      const modal = bootstrap.Modal.getOrCreateInstance($("clueModal"));
      modal.show();
    }

    function markUsed(){
      const key = `${current.categoryIndex}:${current.clueIndex}`;
      used.add(key);
      renderBoard();
    }

    function applyScore(delta){
      const idx = parseInt($("playerSelect").value, 10);
      players[idx].score += delta;
      renderScoreboard();
      markUsed();
      bootstrap.Modal.getOrCreateInstance($("clueModal")).hide();
    }

    /**************************************************************
     * INIT: Setup modal, buttons, music/home
     **************************************************************/
    function init(){
      // scoreboard + board
      renderScoreboard();
      renderBoard();

      // setup modal emoji dropdowns
      populateEmojiSelect($("p1Emoji"));
      populateEmojiSelect($("p2Emoji"));
      populateEmojiSelect($("p3Emoji"));
      $("p1Emoji").value = players[0].emoji;
      $("p2Emoji").value = players[1].emoji;
      $("p3Emoji").value = players[2].emoji;

      // show setup modal immediately
      bootstrap.Modal.getOrCreateInstance($("setupModal")).show();

      $("startGameBtn").addEventListener("click", () => {
        const n1 = $("p1Name").value.trim() || "Contestant 1";
        const n2 = $("p2Name").value.trim() || "Contestant 2";
        const n3 = $("p3Name").value.trim() || "Contestant 3";

        players = [
          { name: n1, emoji: $("p1Emoji").value, score: 0 },
          { name: n2, emoji: $("p2Emoji").value, score: 0 },
          { name: n3, emoji: $("p3Emoji").value, score: 0 },
        ];

        renderScoreboard();
        bootstrap.Modal.getOrCreateInstance($("setupModal")).hide();
      });

      // clue modal reveal
      $("revealBtn").addEventListener("click", () => {
        $("clueAnswer").classList.remove("answer-hidden");
        $("revealBtn").disabled = true;
      });

      // award/penalty
      $("awardBtn").addEventListener("click", () => {
        if (!current) return;
        applyScore(current.value);
      });
      $("penaltyBtn").addEventListener("click", () => {
        if (!current) return;
        applyScore(-current.value);
      });

      // Home + music buttons
      const basePath = basePathFromThisPage();
      const homeURL = `${basePath}/index.html`;

      $("homeButton").addEventListener("click", () => {
        window.location.href = homeURL;
      });

      const bgm = $("bgm");
      const icon = $("musicIcon");
      const aria = "assets/img/buttons/meloetta-aria.png";
      const pir  = "assets/img/buttons/meloetta-pirouette.png";

      $("musicToggle").addEventListener("click", async () => {
        try{
          if (bgm.paused){
            await bgm.play();
            icon.src = pir;
          } else {
            bgm.pause();
            icon.src = aria;
          }
        } catch(e){
          console.warn("Music play blocked until user interaction or file missing:", e);
        }
      });
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
