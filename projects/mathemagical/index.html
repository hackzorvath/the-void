<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VOID • Card</title>

    <!-- Your site CSS -->
    <link rel="stylesheet" href="../css/void.css" />

    <style>
        /* Page-local styling that complements void.css */
        :root {
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.18);
            --panel-bg: rgba(0, 0, 0, 0.35);
            --panel-border: rgba(255, 255, 255, 0.14);
        }

        main {
            width: min(960px, 92vw);
            margin: 0 auto;
            padding: 3rem 0 2rem;
        }

        .void-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: 2.25rem 2rem;
            position: relative;
            overflow: hidden;
        }

        /* subtle “void bloom” */
        .void-card::before {
            content: "";
            position: absolute;
            inset: -40%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.10), transparent 45%),
                radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.06), transparent 50%);
            pointer-events: none;
            filter: blur(8px);
        }

        .void-card>* {
            position: relative;
        }

        .crumbs {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            opacity: 0.95;
        }

        .crumbs a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .sigil {
            font-size: 1.35rem;
            opacity: 0.9;
            user-select: none;
        }

        .subtitle {
            text-align: center;
            color: var(--color-muted);
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.98rem;
            letter-spacing: 0.3px;
        }

        .section {
            margin-top: 1.6rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
        }

        .label {
            display: inline-block;
            font-size: 0.85rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--color-muted);
            margin-bottom: 0.5rem;
        }

        .equation {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            padding: 1rem 1.1rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.98rem;
            line-height: 1.45;
            overflow-x: auto;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.22);
        }

        .desc {
            font-size: 1.05rem;
            line-height: 1.65;
            margin: 0.25rem 0 0;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.75rem;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            main {
                padding-top: 2rem;
            }

            .void-card {
                padding: 1.7rem 1.25rem;
            }

            h1 {
                font-size: 2.0rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <!-- Optional: your floating home/music buttons can be included here if you want -->

    <main>
        <div class="void-card">
            <div class="crumbs">
                <a href="./index.html">← Back to Cabinet</a>
                <div class="sigil" aria-hidden="true">✶</div>
            </div>

            <header>
                <h1>NAME GOES HERE</h1>
                <div class="subtitle">The Cabinet of Unvisualizable Giants</div>
            </header>

            <section class="section">
                <div class="label">Equation / Definition</div>
                <div class="equation">EQUATION GOES HERE</div>
            </section>

            <section class="section">
                <div class="label">Brief Description</div>
                <p class="desc">DESCRIPTION GOES HERE</p>
            </section>

            <div class="footer-links">
                <a class="instructor-btn" href="./index.html">Return</a>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../../assets/scripts/common.js"></script>
</body>

</html>
