<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jack's Void — Travel</title>
    <link rel="icon" type="image/x-icon" href="../favicon.png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />

    <!-- Bootstrap + fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />

    <!-- Your site styles -->
    <link rel="stylesheet" href="../assets/css/common.css" />
    <link rel="stylesheet" href="../themes/void.css" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        /* Layout: sidebar + map */
        .travel-shell {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .travel-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        #map {
            width: 100%;
            min-height: 520px;
            height: 70vh;
        }

        .pin-list {
            max-height: 70vh;
            overflow: auto;
            padding: 1rem;
        }

        /* Match your “pill” vibe without fighting Bootstrap */
        .pin-btn {
            width: 100%;
            text-align: left;
            padding: 0.75rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.10);
            color: var(--color-text);
            transition: transform 0.15s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.65rem;
        }

        .pin-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }

        .pin-emoji {
            font-size: 1.15rem;
            width: 1.6rem;
            text-align: center;
            flex: 0 0 auto;
        }

        .pin-meta {
            font-size: 0.85rem;
            opacity: 0.75;
            margin-left: auto;
        }

        /* Leaflet popup styling (optional) */
        .leaflet-popup-content-wrapper {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .leaflet-popup-tip {
            background: rgba(0, 0, 0, 0.85);
        }
    </style>
</head>

<body>
    <!-- Optional per-page music (your common.js will create the Meloetta toggle if #bgm exists) -->
    <audio id="bgm" loop preload="auto">
        <source src="../assets/sfx/travel.mp3" type="audio/mpeg" />
        Your browser cannot hear the music of the spheres.
    </audio>

    <!-- Header injected by common.js -->
    <div id="header-placeholder"></div>

    <!-- Your existing navbar can live here (static), or you can component-ize it later -->
    <nav class="navbar navbar-expand-md text-center">
        <div class="container-fluid justify-content-center">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-center" id="mainNavbar">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item"><a class="nav-link" href="../saskpolytech/index.html">🎓 Work 🏛️</a></li>
                    <li class="nav-item"><a class="nav-link" href="../games/index.html">🎲 Games 🎮</a></li>
                    <li class="nav-item"><a class="nav-link" href="../musings/index.html">📇 Musings 📜</a></li>
                    <li class="nav-item"><a class="nav-link" href="../projects/index.html">💡 Projects 🛠️</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">📩 Contact 📞</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container travel-shell">
        <div class="travel-card">
            <div class="row g-0">
                <!-- Sidebar buttons -->
                <div class="col-12 col-md-4 border-end border-light border-opacity-10">
                    <div class="p-3 border-bottom border-light border-opacity-10">
                        <h2 class="mb-1">Travel Map</h2>
                        <div class="opacity-75">Click a place to fly the map there.</div>
                    </div>
                    <div id="pinList" class="pin-list"></div>
                </div>

                <!-- Map -->
                <div class="col-12 col-md-8">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer injected by common.js -->
    <div id="footer-placeholder"></div>

    <!-- Your existing loader (now loads header + footer + floating buttons) -->
    <script src="../assets/scripts/common.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        /**************************************************************
         * 1) Define your places here (one source of truth).
         *    Add as many as you like.
         **************************************************************/
        const PLACES = [
            { id: "regina", name: "Regina", kind: "Saskatchewan", emoji: "🏙️", lat: 50.4452, lng: -104.6189 },
            { id: "laguna-beach", name: "Laguna Beach", kind: "California", emoji: "🌅", lat: 33.5427, lng: -117.7854 },
            { id: "toronto", name: "Toronto", kind: "Ontario", emoji: "🏙️", lat: 43.6532, lng: -79.3832 },
            { id: "cabo-san-lucas", name: "Cabo San Lucas", kind: "Mexico", emoji: "🌵", lat: 22.8905, lng: -109.9167 },
            { id: "puerto-vallarta", name: "Puerto Vallarta", kind: "Mexico", emoji: "🌊", lat: 20.6534, lng: -105.2253 },
            { id: "mazatlan", name: "Mazatlán", kind: "Mexico", emoji: "🏖️", lat: 23.2494, lng: -106.4111 },
            { id: "munich", name: "Munich", kind: "Germany", emoji: "🍻", lat: 48.13750, lng: 11.57500 },
            { id: "nice", name: "Nice", kind: "France", emoji: "🌊", lat: 43.7034, lng: 7.2663 },
            { id: "monaco", name: "Monaco", kind: "France", emoji: "🏎️", lat: 43.7309, lng: 7.4241 },
            { id: "zurich", name: "Zurich", kind: "Switzerland", emoji: "🏔️", lat: 47.36667, lng: 8.55 },
            { id: "shanghai", name: "Shanghai", kind: "China", emoji: "🌃", lat: 31.22861, lng: 121.47472 },
            { id: "newportnews", name: "Newport News", kind: "city", emoji: "🌲", lat: 37.0871, lng: -76.4730 },
            { id: "bangkok", name: "Bangkok", kind: "Thailand", emoji: "🌴", lat: 13.7563, lng: 100.5018 },
            { id: "vientiane", name: "Vientiane", kind: "Laos", emoji: "🏞️", lat: 17.9757, lng: 102.6331 },
            { id: "siemreap", name: "Siem Reap", kind: "Cambodia", emoji: "🛕", lat: 13.3633, lng: 103.8564 },
        ];

        /**************************************************************
         * 2) Init map (OpenStreetMap tiles, no tokens).
         **************************************************************/
        const map = L.map("map", { zoomControl: true }).setView([43.6532, -79.3832], 4);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        /**************************************************************
         * 3) Build markers + buttons.
         **************************************************************/
        const markersById = new Map();

        function markerIcon(emoji) {
            return L.divIcon({
                className: "",
                html: `<div style="
          font-size: 22px;
          line-height: 22px;
          filter: drop-shadow(0 0 6px rgba(255,255,255,0.25));
        ">${emoji}</div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12],
            });
        }

        function flyToPlace(place) {
            map.flyTo([place.lat, place.lng], Math.max(map.getZoom(), 6), {
                animate: true,
                duration: 0.9
            });
            const marker = markersById.get(place.id);
            if (marker) marker.openPopup();
        }

        // Add markers
        for (const p of PLACES) {
            const m = L.marker([p.lat, p.lng], { icon: markerIcon(p.emoji) })
                .addTo(map)
                .bindPopup(`<strong>${p.name}</strong><br><span style="opacity:.8">${p.kind}</span>`);
            markersById.set(p.id, m);
        }

        // Build sidebar list
        const pinList = document.getElementById("pinList");
        pinList.innerHTML = "";

        for (const p of PLACES) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "pin-btn";
            btn.innerHTML = `
        <span class="pin-emoji">${p.emoji}</span>
        <span>${p.name}</span>
        <span class="pin-meta">${p.kind}</span>
      `;
            btn.addEventListener("click", () => flyToPlace(p));
            pinList.appendChild(btn);
        }

        // Fit bounds if you want to show everything immediately:
        // const bounds = L.latLngBounds(PLACES.map(p => [p.lat, p.lng]));
        // map.fitBounds(bounds.pad(0.2));
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
