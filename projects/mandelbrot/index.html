<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mandelbrot — The Void</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-void text-light">

    <!-- HEADER (swap with your real Void header whenever) -->
    <header class="void-header border-bottom border-secondary">
        <div class="container-fluid py-2 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <span class="fw-semibold">The Void</span>
                <span class="text-secondary">/ Mandelbrot</span>
            </div>

            <div class="d-flex align-items-center gap-2">
                <button id="resetBtn" class="btn btn-sm btn-outline-secondary">Reset</button>
                <button id="qualityBtn" class="btn btn-sm btn-outline-secondary">Quality: High</button>
                <button id="hudBtn" class="btn btn-sm btn-outline-secondary">HUD</button>
            </div>
        </div>
    </header>

    <main class="void-main">
        <!-- WebGL canvas (GPU) -->
        <canvas id="glCanvas"></canvas>

        <!-- Fallback 2D canvas (CPU) -->
        <canvas id="cpuCanvas" class="d-none"></canvas>

        <div id="hud" class="hud shadow-sm">
            <div class="hud-row">
                <span class="hud-label">Renderer</span>
                <span id="hudRenderer" class="hud-value"></span>
            </div>
            <div class="hud-row">
                <span class="hud-label">Center</span>
                <span id="hudCenter" class="hud-value"></span>
            </div>
            <div class="hud-row">
                <span class="hud-label">Scale</span>
                <span id="hudScale" class="hud-value"></span>
            </div>
            <div class="hud-row">
                <span class="hud-label">Iterations</span>
                <span id="hudIter" class="hud-value"></span>
            </div>
            <div class="hud-row hud-hint text-secondary">
                Desktop: scroll zoom • drag pan • click zoom<br>
                Mobile: drag pan • double-tap zoom • pinch zoom
            </div>
        </div>
    </main>

    <script src="main.js"></script>
    <script src="../../assets/scripts/common.js"></script>
</body>

</html>
