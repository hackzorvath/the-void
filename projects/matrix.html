<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />

    <title>Jack's Void — Matrix</title>
    <link rel="icon" type="image/x-icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="../assets/css/common.css" />

    <!-- Matrix layering CSS (can also go in a shared css file) -->
    <style>
        #matrixCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        header,
        nav,
        main,
        #footer-placeholder,
        footer {
            position: relative;
            z-index: 1;
        }
    </style>

    <style>
        #matrixCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        /* FORCE your real UI above it */
        header,
        nav,
        main,
        #footer-placeholder,
        footer {
            position: relative;
            z-index: 1;
        }
    </style>

</head>

<body>
    <!-- ✅ Background layer -->
    <canvas id="matrixCanvas"></canvas>

    <!-- ✅ Your existing star field (optional) -->
    <script>
        for (let i = 0; i < 60; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(s);
        }
    </script>

    <!-- ✅ Required for your existing common.js music toggle -->
    <audio id="bgm" loop preload="auto">
        <source src="../assets/sfx/abstract.mp3" type="audio/mpeg">
        Your browser cannot hear the music of the spheres.
    </audio>

    <div id="footer-placeholder"></div>
    <script src="../assets/scripts/common.js"></script>

    <!-- ✅ Matrix effect script -->
    <script src="../assets/scripts/matrix.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
