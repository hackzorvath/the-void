<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lost in the Void</title>

    <!-- Favicon (adjust if needed) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        :root {
            --gold: #ffcc66;
            --gold-soft: #ffdd88;
            --gold-dim: #c9a23f;
            --void: #000;
        }

        body {
            background: radial-gradient(circle at top, #111 0%, #000 60%);
            color: var(--gold);
            font-family: Georgia, serif;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px 0;
            text-shadow:
                0 0 8px var(--gold),
                0 0 20px rgba(255, 200, 80, 0.6);
            animation: flicker 4s infinite alternate;
        }

        p {
            font-size: 16px;
            opacity: 0.85;
            margin: 0 0 36px 0;
        }

        /* ─── VOID PILL BUTTON ───────────────────────── */

        .void-pill {
            display: inline-flex;
            align-items: center;
            gap: 14px;

            padding: 14px 26px;
            border-radius: 999px;

            text-decoration: none;
            font-family: "Cinzel", Georgia, serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;

            color: var(--gold);
            border: 1px solid var(--gold-dim);

            background:
                radial-gradient(circle at top, rgba(255, 220, 120, 0.12), transparent 60%),
                linear-gradient(to bottom, #111, #000);

            box-shadow:
                0 0 16px rgba(255, 200, 80, 0.18),
                inset 0 0 10px rgba(255, 200, 80, 0.12);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.3s ease;

            animation: voidPulse 3.5s infinite;
        }

        .void-pill:hover,
        .void-pill:focus-visible {
            transform: translateY(-2px) scale(1.04);
            box-shadow:
                0 0 28px rgba(255, 220, 120, 0.4),
                inset 0 0 16px rgba(255, 220, 120, 0.22);
        }

        .void-glyph {
            font-size: 40px;
            line-height: 1;
            display: inline-block;

            filter: drop-shadow(0 0 8px rgba(255, 220, 120, 0.35));

            animation:
                glyphRotate 28s linear infinite,
                glyphFloat 4s ease-in-out infinite;
        }

        .void-pill:hover .void-glyph {
            animation-play-state: paused;
        }

        .void-text {
            font-size: 13px;
            white-space: nowrap;
        }

        /* ─── ANIMATIONS ───────────────────────────── */

        @keyframes voidPulse {
            0%   {
                box-shadow:
                    0 0 14px rgba(255,200,80,0.18),
                    inset 0 0 10px rgba(255,200,80,0.12);
            }
            50%  {
                box-shadow:
                    0 0 26px rgba(255,220,120,0.42),
                    inset 0 0 16px rgba(255,220,120,0.22);
            }
            100% {
                box-shadow:
                    0 0 14px rgba(255,200,80,0.18),
                    inset 0 0 10px rgba(255,200,80,0.12);
            }
        }

        @keyframes glyphRotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @keyframes glyphFloat {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-4px); }
            100% { transform: translateY(0); }
        }

        @keyframes flicker {
            from { opacity: 1; }
            to   { opacity: 0.85; }
        }
    </style>
</head>

<body>
    <h1>404 — This Path Does Not Exist</h1>
    <p>Have you tried turning the Void off and on again?</p>

    <a id="homeLink" class="void-pill" href="#">
        <span class="void-glyph">🌌</span>
        <span class="void-text">Return to The Void</span>
    </a>

    <script>
        // Set to "/" for custom domains
        // Set to "/the-void/" for GitHub Pages project sites
        const HOME_PATH = "/the-void/";
        document.getElementById("homeLink").setAttribute("href", HOME_PATH);
    </script>
</body>
</html>
